limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    server_tokens off;          # hide the nginx version in headers and error pages
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10M;   # product image uploads

    # Uploaded files (Laravel "public" disk) straight from the uploads volume
    location /storage/ {
        alias /var/www/html/storage/app/public/;
    }

    limit_req_status 429;

    location = /api/v1/auth/login {
        limit_req zone=login burst=30 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # R4/R5: proxy WebSocket upgrade to Reverb server
    location /app/ {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

}