openapi: 3.0.3
info:
  title: E-Commerce Platform API
  version: 1.0.0
  description: |
    Main application API (Laravel). All endpoints are under `/api/v1`.

    **Auth:** `POST /auth/login` returns a JWT (RS256, 60 min). Click **Authorize** and paste the
    `access_token` to call protected endpoints.

    **Errors** always use one shape: `{"error": {"code": "...", "message": "...", "details": {...}}}`.

    **Stock** lives in a separate inventory service (Spring Boot, gRPC); products and orders call it.

    **Caching:** product list and details are cached in Redis (TTL 10 min, invalidated on every
    product write) and carry an `ETag`; send it back in `If-None-Match` to get `304 Not Modified`.
    Stock is never cached. Every API response carries diagnostic headers:
    `X-Read-From` (which database answered), `X-Replica` (read replica health), and on product
    reads `X-Cache` (HIT / MISS / BYPASS).

    **Rate limits:** API requests per user (or IP) per minute, and `POST /auth/login` is also
    limited per IP by nginx. Over the limit → `429`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local (docker compose)

tags:
  - name: Auth
  - name: Products
  - name: Orders
  - name: Notifications

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: The requested resource was not found. }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              example: { email: ["The email has already been taken."] }

    User:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Sara }
        email: { type: string, example: sara@test.com }
        role: { type: string, enum: [customer, admin] }

    TokenResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string, example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9... }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }

    Product:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Desk Lamp }
        description: { type: string, nullable: true }
        price: { type: string, example: "24.99" }
        category: { type: string, example: lighting }
        image_url: { type: string, nullable: true, example: http://localhost:8000/storage/products/abc.jpg }
        stock:
          type: integer
          nullable: true
          description: From the inventory service. null = inventory temporarily unavailable.
          example: 5
        in_stock: { type: boolean, nullable: true }

    Order:
      type: object
      properties:
        id: { type: integer, example: 8 }
        status:
          type: string
          enum: [pending, confirmed, rejected, failed, shipped, delivered, cancelled]
        total: { type: string, example: "49.98" }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer, example: 3 }
              name: { type: string, example: Desk Lamp }
              quantity: { type: integer, example: 2 }
              unit_price: { type: string, example: "24.99" }
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: integer, example: 8 }
        status: { type: string, example: shipped }
        message: { type: string, example: "Your order #8 is now shipped." }
        read: { type: boolean }
        created_at: { type: string, format: date-time }

    PageMeta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page: { type: integer, example: 15 }
        total: { type: integer, example: 42 }
        last_page: { type: integer, example: 3 }

  headers:
    ETag:
      description: Hash of the response body. Send it back in If-None-Match.
      schema: { type: string, example: '"8aeee0d1c2…"' }
    XCache:
      description: "HIT = served from Redis, MISS = loaded from the database and cached, BYPASS = cache disabled"
      schema: { type: string, enum: [HIT, MISS, BYPASS] }
    XReadFrom:
      description: "Database(s) the request actually read from: none (no query), primary, replica, or primary+replica"
      schema: { type: string, example: replica }
    XReplica:
      description: "Read replica health from the heartbeat monitor: healthy (lag), lagging (lag), down, unknown, disabled. Anything but healthy sends reads to the primary."
      schema: { type: string, example: healthy (1.0s) }

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from a previous response. If the data has not changed the server answers 304 with no body.
      schema: { type: string }

  responses:
    NotModified:
      description: Not modified since the ETag in If-None-Match (no body)
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
    TooManyRequests:
      description: Rate limit exceeded (429 TOO_MANY_REQUESTS)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: Missing, invalid or expired token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not allowed (e.g. not admin, or someone else's order)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationFailed:
      description: Invalid input (422 VALIDATION_FAILED with per-field details)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InventoryUnavailable:
      description: Inventory service down or too slow (503 INVENTORY_UNAVAILABLE)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account (and log in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100, example: Sara }
                email: { type: string, format: email, example: sara@test.com }
                password: { type: string, minLength: 8, maxLength: 72, example: secret123 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get an access token
      description: Rate limited to 5 attempts per minute per email + IP (429 TOO_MANY_REQUESTS with Retry-After).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@test.com }
                password: { type: string, example: secret123 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: INVALID_CREDENTIALS, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { description: TOO_MANY_REQUESTS, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/me:
    get:
      tags: [Auth]
      summary: The authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /products:
    get:
      tags: [Products]
      summary: List products (paginated, optional category filter, live stock)
      parameters:
        - { name: category, in: query, schema: { type: string }, example: lighting }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Cache: { $ref: '#/components/headers/XCache' }
            X-Read-From: { $ref: '#/components/headers/XReadFrom' }
            X-Replica: { $ref: '#/components/headers/XReplica' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Products]
      summary: Create a product (admin only) with image and initial stock
      description: Product row (MySQL) and initial stock (inventory SetStock) are created together; if inventory fails the product is rolled back.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, price, category, stock]
              properties:
                name: { type: string, maxLength: 150 }
                description: { type: string }
                price: { type: number, minimum: 0, example: 24.99 }
                category: { type: string, maxLength: 50 }
                stock: { type: integer, minimum: 0 }
                image: { type: string, format: binary, description: "jpg, png, webp; max 2 MB" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/InventoryUnavailable' }

  /products/{id}:
    get:
      tags: [Products]
      summary: Product details with live stock
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Cache: { $ref: '#/components/headers/XCache' }
            X-Read-From: { $ref: '#/components/headers/XReadFrom' }
            X-Replica: { $ref: '#/components/headers/XReplica' }
          content:
            application/json:
              schema: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } } }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Update a product (admin only); send only the fields to change
      description: |
        Writes go to the primary. After the commit the product's cache entry is removed and all
        cached product lists are invalidated (list version bump), so the change is visible on the
        next read and old ETags no longer match. `stock` is forwarded to the inventory service.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 150 }
                description: { type: string, nullable: true, maxLength: 5000 }
                price: { type: number, minimum: 0, example: 19.99 }
                category: { type: string, maxLength: 50 }
                stock: { type: integer, minimum: 0, maximum: 1000000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/InventoryUnavailable' }

  /orders:
    get:
      tags: [Orders]
      summary: List orders (customers see only their own; admins see all)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Orders]
      summary: Place an order (saga - reserve stock in inventory)
      description: |
        1. Order saved as `pending`  2. ReserveStock in inventory (order id = idempotency key)
        3. `confirmed`. Not enough stock → 409 (order `rejected`). Inventory down → 503 (order stays `pending`,
        released later by the cleanup job). Failure after reserving → stock released, order `failed`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer, example: 3 }
                      quantity: { type: integer, minimum: 1, maximum: 100, example: 2 }
      responses:
        '201':
          description: Created (confirmed)
          content:
            application/json:
              schema: { type: object, properties: { order: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: INSUFFICIENT_STOCK, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/InventoryUnavailable' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Order details (owner or admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { order: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Change order status (admin only)
      description: "Allowed: confirmed → shipped | cancelled, shipped → delivered. Cancelling releases the stock."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [shipped, delivered, cancelled] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { order: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: INVALID_STATUS_TRANSITION, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications (newest first, with unread count)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  meta:
                    type: object
                    properties:
                      unread: { type: integer, example: 1 }
                      current_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one of my notifications as read
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { notification: { $ref: '#/components/schemas/Notification' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
