# Whole platform:  docker compose up -d --build
name: ecommerce-platform

services:
  #  Laravel (PHP-FPM) 
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file: ./app/.env            # runtime config & secrets (not baked into the image)
    volumes:
      - ./app/storage/keys:/var/www/html/storage/keys        # JWT keys (secrets)
      - app-uploads:/var/www/html/storage/app/public         # uploaded product images survive rebuilds
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      INVENTORY_GRPC_TARGET: inventory:9090
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  # Laravel scheduler (runs scheduled commands, e.g. the saga cleanup)
  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    user: www-data
    env_file: ./app/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      INVENTORY_GRPC_TARGET: inventory:9090
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  # API docs: Swagger UI for docs/openapi.yaml → http://localhost:8081
  swagger:
    image: swaggerapi/swagger-ui:v5.34.1
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./docs:/docs:ro

  #  Web server in front of Laravel 
  web:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./app/public:/var/www/html/public:ro                  # static files (index.php itself runs in the app image)
      - app-uploads:/var/www/html/storage/app/public:ro      # serves /storage/... product images
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [backend]

  #  Inventory service (Spring Boot, gRPC) 
  inventory:
    build:
      context: .
      dockerfile: docker/inventory/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  #  Databases 
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  # Contract tooling (not started by "up"; run on demand)
  #   docker compose run --rm buf lint
  #   docker compose run --rm buf generate
  buf:
    image: bufbuild/buf:1.75.0
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace

volumes:
  mysql-data:
  postgres-data:
  app-uploads:

networks:
  backend:
