# Whole platform:  docker compose up -d --build
name: ecommerce-platform

services:
  #  Laravel (PHP-FPM) 
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file: ./app/.env            # runtime config & secrets (not baked into the image)
    volumes:
      - ./app/storage/keys:/var/www/html/storage/keys        # JWT keys (secrets)
      - app-uploads:/var/www/html/storage/app/public         # uploaded product images survive rebuilds
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      INVENTORY_GRPC_TARGET: inventory:9090
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  # Laravel scheduler (runs scheduled commands, e.g. the saga cleanup)
  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    user: www-data
    env_file: ./app/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      INVENTORY_GRPC_TARGET: inventory:9090
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    networks: [backend]

  health-monitor:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: ["php", "artisan", "health:monitor"]
    user: www-data
    restart: unless-stopped
    env_file: ./app/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      INVENTORY_GRPC_TARGET: inventory:9090
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  # R4/R5 real-time: self-hosted WebSocket server (Laravel Reverb, Pusher-compatible)
  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    user: www-data
    restart: unless-stopped
    env_file: ./app/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  # R4 worker: consumes order events and sends confirmation emails via external SMTP
  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: ["php", "artisan", "notifications:consume-confirmations"]
    user: www-data
    restart: unless-stopped
    env_file: ./app/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      INVENTORY_GRPC_TARGET: inventory:9090
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_HEARTBEAT: 60
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

    # Processes queued jobs: the broadcasts to Reverb (R4/R5 real-time)
  queue:
      build:
        context: .
        dockerfile: docker/app/Dockerfile
      command: [ "php", "artisan", "queue:work", "--tries=3", "--sleep=1" ]
      user: www-data
      restart: unless-stopped
      env_file: ./app/.env
      environment:
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: ${MYSQL_DATABASE}
        DB_USERNAME: ${MYSQL_USER}
        DB_PASSWORD: ${MYSQL_PASSWORD}
        REDIS_HOST: redis
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks: [ backend ]

  # API docs: Swagger UI for docs/openapi.yaml → http://localhost:8081
  swagger:
    image: swaggerapi/swagger-ui:v5.34.1
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./docs:/docs:ro

  #  Web server in front of Laravel
  web:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./app/public:/var/www/html/public:ro                  # static files (index.php itself runs in the app image)
      - app-uploads:/var/www/html/storage/app/public:ro      # serves /storage/... product images
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [backend]

  #  Inventory service (Spring Boot, gRPC)
  inventory:
    build:
      context: .
      dockerfile: docker/inventory/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  #  Databases
  mysql:
    image: mysql:8.4
    command: ["--server-id=1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  mysql-replica:
    image: mysql:8.4
    hostname: mysql-replica
    command: ["--server-id=2", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--relay-log=replica-relay-bin"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_REPLICA_PORT:-23306}:3306"
    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./docker/mysql:/scripts:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Message broker (order events -> email worker)
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks: [backend]

  # Contract tooling (not started by "up"; run on demand)
  #   docker compose run --rm buf lint
  #   docker compose run --rm buf generate
  buf:
    image: bufbuild/buf:1.75.0
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace

volumes:
  mysql-data:
  postgres-data:
  mysql-replica-data:
  app-uploads:
  rabbitmq-data:

networks:
  backend:
